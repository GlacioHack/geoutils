# Default global parameters for GeoUtils
# See online documentation for more information

[resampling]

# Default resampling of raster values, onto a raster grid or at points
raster_resampling_method = linear

# Default resampling of point cloud values, onto a raster grid or at points
point_resampling_method = linear

# How missing values are handled during interpolation and gridding
interpolation_nodata_handling = nearest

[projection]

# Densify edges when projecting bounds and footprints
densify_points = 5000

[raster]

# Return new rasters as a dataarray or dataset
raster_return_type = dataarray

[pointcloud]

# Return new point clouds as a dataarray, dataset or geodataframe
pointcloud_return_type = dataarray

[interpretation]

# Raise a warning if two rasters have different pixel interpretation
warn_area_or_point = False
