[build-system]
# Minimum requirements for the build system to execute.
requires = [
    "setuptools>=64",
    "setuptools_scm[toml]>=8,<9.0",
    "wheel",
]
build-backend = "setuptools.build_meta"

# To write version to file
[tool.setuptools_scm]
version_file = "geoutils/_version.py"
fallback_version = "0.0.1"
# Use no-local-version by default for CI builds
local_scheme = "no-local-version"

[tool.black]
target_version = ['py310']

[tool.mypy]
allow_untyped_decorators = true
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
addopts = "--doctest-modules --doctest-ignore-import-errors -W error::UserWarning --import-mode=importlib"
log_level = "WARNING"
testpaths = ["tests", "geoutils", "benchmarks/test_large_data.py"]
markers = [
    "allow_logging_warnings: allow a test to emit logging warnings/errors collected by the autouse fixture",
    "large_data: large data tests that are skipped unless --large-data is passed",
    "memory: memory-pressure or out-of-core memory tests",
]
