[build-system]
# Minimum requirements for the build system to execute.
requires = [
    "setuptools>=64",
    "setuptools_scm[toml]>=8",
    "wheel",
]
build-backend = "setuptools.build_meta"

# To write version to file
[tool.setuptools_scm]
version_file = "geoutils/_version.py"
fallback_version = "0.0.1"
# Use no-local-version by default for CI builds
local_scheme = "no-local-version"

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
ignore = ["B028", "B9", "E203", "E226", "E24"]
preview = true
select = ["B", "C4", "E", "F", "W"]

[tool.mypy]
allow_untyped_decorators = true
disable_error_code = ["untyped-decorator"]

[tool.pytest.ini_options]
addopts = "-p no:doctest --import-mode=importlib"
filterwarnings = [
    "error",  # Raise errors for unexpected warnings
    # Ignore Affine's multiplication deprecation in Rasterio and Rioxarray
    'ignore:^Use `@` matmul instead of `\*` mul operator for matrix multiplication$:PendingDeprecationWarning',
    # Ignore Laspy's ctypes layout deprecation on Python 3.14+
    "ignore:^Due to '_pack_'.*:DeprecationWarning:^laspy\\.vlrs\\.known$",
    # Ignore NumPy's scalar conversion deprecation inside Pyproj
    'ignore:^Conversion of an array with ndim > 0 to a scalar:DeprecationWarning:(.*[/\\])?pyproj[./\\]transformer$',
    # Ignore floating point warnings from Shapely's GEOS calls on macOS
    'ignore:^divide by zero encountered in oriented_envelope$:RuntimeWarning:(.*[/\\])?shapely[./\\]constructive$',
    'ignore:^invalid value encountered in oriented_envelope$:RuntimeWarning:(.*[/\\])?shapely[./\\]constructive$',
    'ignore:^invalid value encountered in shared_paths$:RuntimeWarning:(.*[/\\])?shapely[./\\]linear$',
]
log_level = "WARNING"
testpaths = ["tests", "geoutils", "benchmarks/test_large_data.py"]
markers = [
    "allow_logging_warnings: allow a test to emit logging warnings/errors collected by the autouse fixture",
    "large_data: large data tests that are skipped unless --large-data is passed",
    "memory: memory-pressure or out-of-core memory tests",
]
