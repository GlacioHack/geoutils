# This workflow will install Python dependencies and run tests across Linux/macOS/Windows and multiple versions of Python
# For more information see: https://help.github.com/actions/language-and-framework-guides/using-python-with-github-actions

name: pytest

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ${{ matrix.os }}, python ${{ matrix.python-version }}, ${{ matrix.dep-level }}
    runs-on: ${{ matrix.os }}

    strategy:
      fail-fast: true
      matrix:
        os: ["ubuntu-latest", "macos-latest", "windows-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        dep-level: ["base", "opt"]

    defaults:
      run:
        # Use PowerShell on Windows to better work with setup-miniconda
        shell: ${{ startsWith(matrix.os, 'windows') && 'pwsh' || 'bash -el {0}' }}

    steps:
    - uses: actions/checkout@v7

    # We initiate the environment empty, and check if a key for this environment doesn't already exist in the cache
    - name: Initiate empty environment
      uses: conda-incubator/setup-miniconda@v4
      with:
        # Pin Windows to the previous installer while investigating the Conda initialization failure
        miniforge-version: ${{ runner.os == 'Windows' && '26.7.2-1' || 'latest' }}
        auto-update-conda: ${{ runner.os != 'Windows' }}
        use-mamba: true
        channel-priority: strict
        activate-environment: geoutils-dev

    - uses: astral-sh/setup-uv@v10.3.3
      with:
        enable-cache: true

    - name: Get month for resetting cache
      id: get-date
      run: echo "cache_date=$(/bin/date -u '+%Y%m')" >> $GITHUB_ENV
      shell: bash

    - name: Cache conda env
      uses: actions/cache@v6
      with:
        path: ${{ env.CONDA }}/envs
        key: conda-${{ matrix.os }}-${{ matrix.python-version }}-${{ matrix.dep-level }}-${{ env.cache_date }}-${{ hashFiles('dev-environment.yml') }}-${{ env.CACHE_NUMBER }}
      env:
        CACHE_NUMBER: 6 # Increase this value to reset cache if environment.yml has not changed
      id: cache

    # The trick below is necessary because the generic environment file does not specify a Python version, and ONLY
    # "conda env update" CAN BE USED WITH CACHING, which upgrades the Python version when using the base environment
    # (we add "graphviz" from dev-environment to solve all dependencies at once, at graphviz relies on image
    # processing packages very much like geo-packages; not a problem for docs, dev installs where all is done at once)
    - name: Install base environment with a fixed Python version
      if: steps.cache.outputs.cache-hit != 'true'
      env:
        # Fiona 1.10.1 has no Python 3.14 wheels, so install it with Conda
        # Use Conda's OpenMP runtime for PyTorch and its numerical dependencies
        # PDAL 2.8 shares compatible PROJ and GDAL versions with Python 3.10's PyProj and Fiona
        # Share Conda's HDF5 and Arrow libraries with GDAL/PDAL on Windows
        CI_EXTRA_DEPS: >-
          gdal<3.13.3,pdal${{ matrix.python-version == '3.10' && '=2.8' || '>=2.10' }},python-pdal${{
          runner.os == 'Windows' && ',netcdf4' || '' }}${{
          runner.os == 'Windows' && matrix.dep-level != 'base' && ',pyarrow>=14' || '' }}${{
          matrix.dep-level != 'base' && ',fiona>=1.10' || '' }}${{
          runner.os != 'Linux' && matrix.dep-level != 'base' && ',pytorch-cpu>=2,gpytorch>=1.11' || '' }}
      run: |
        mamba install pyyaml python=${{ matrix.python-version }}
        python .github/scripts/generate_yml_env_fixed_py.py --pyv ${{ matrix.python-version }} --add "${{ env.CI_EXTRA_DEPS }}" "environment.yml"
        mamba env update -n geoutils-dev -f environment-ci-py${{ matrix.python-version }}.yml

    # If/else equivalent to install base environment, or base+optional
    - name: Install project environment (base)
      if: ${{ matrix.dep-level == 'base' }}
      run: uv pip install -e ".[test]"

    - name: Install project environment (optional)
      if: ${{ matrix.dep-level != 'base' }}
      # Hosted runners use CPUs, so avoid loading PyTorch's CUDA libraries on Windows
      run: uv pip install --torch-backend=cpu -e ".[test,${{ matrix.dep-level }}]"

    - name: Check GeoUtils and PDAL imports
      run: python -c "import geoutils; import pdal; print('PDAL:', pdal.__version__)"

    - name: Check GPyTorch imports
      if: ${{ matrix.dep-level != 'base' }}
      # Import geospatial and geostatistical libraries before PyTorch, as in the tests
      run: >-
        python -c "import geoutils; import skgstat; import gstools;
        import torch; import gpytorch; print(torch.__version__)"

    - name: Print conda environment (for debugging)
      run: |
        conda info
        conda list

    - name: Test with pytest
      if: ${{ runner.os != 'Windows' }}
      env:
        # Render plots without a GUI backend (avoid Tcl/Tk issues on Windows)
        MPLBACKEND: Agg
        # Record compiled Numba lines when the test suite first compiles each function
        NUMBA_JIT_COVERAGE: "1"
        NUMBA_CACHE_DIR: ${{ runner.temp }}
      # Module execution also collects tests from the repository-only benchmarks package
      run: python -m pytest -ra --durations=30 --cov=geoutils/ --cov-report=lcov

    - name: Test with pytest shutdown diagnostics
      if: ${{ runner.os == 'Windows' }}
      env:
        MPLBACKEND: Agg
        NUMBA_JIT_COVERAGE: "1"
        NUMBA_CACHE_DIR: ${{ runner.temp }}
        PYTHONFAULTHANDLER: "1"
        PYTHONUNBUFFERED: "1"
      run: |
        $PSNativeCommandUseErrorActionPreference = $false
        $debugger = "${env:ProgramFiles(x86)}\Windows Kits\10\Debuggers\x64\cdb.exe"
        if (-not (Test-Path $debugger)) {
          throw "Windows Debugging Tools are missing: $debugger"
        }
        # Catch DLL crashes after Python has removed its fault handler
        $debuggerCommands = 'sxd -c2 ".ecxr; ~* kb; lmf; .dump /m /o pytest-crash.dmp; q" av; g'
        $testStartTime = Get-Date
        $testProcess = Start-Process -FilePath (Get-Command python).Source -NoNewWindow -PassThru -ArgumentList @(
          '.github/scripts/run_pytest_diagnostics.py', '-ra', '--durations=30', '--cov=geoutils/', '--cov-report=lcov'
        )
        # Hold the process handle so its exit code remains available after the debugger exits
        $null = $testProcess.Handle
        & $debugger -G -hd -logo pytest-debugger.log -p $testProcess.Id -c $debuggerCommands
        $debuggerExitCode = $LASTEXITCODE
        if ($debuggerExitCode -ne 0 -and -not $testProcess.HasExited) {
          Stop-Process -Id $testProcess.Id -Force
        }
        $testProcess.WaitForExit()
        $testExitCode = $testProcess.ExitCode
        Write-Host "[pytest diagnostics] Python process exit code: $testExitCode"
        # Quitting the debugger after a crash can replace the Python exit code
        if ($testExitCode -eq 0 -and ($debuggerExitCode -ne 0 -or (Test-Path pytest-crash.dmp))) {
          $testExitCode = 1
        }
        if ($testExitCode -ne 0) {
          # Windows records the faulting DLL even after Python's fault handler shuts down
          $crashes = Get-WinEvent -FilterHashtable @{
            LogName = 'Application'
            ProviderName = 'Application Error'
            Id = 1000
            StartTime = $testStartTime
          } -ErrorAction SilentlyContinue
          $crashes | Where-Object { $_.Message -match '(?i)python[^\s]*\.exe' } | ForEach-Object {
            Write-Host "[pytest diagnostics] Windows crash report:`n$($_.Message)"
          }
        }
        exit $testExitCode

    - name: Upload Windows crash diagnostics
      if: ${{ failure() && runner.os == 'Windows' }}
      uses: actions/upload-artifact@v7
      with:
        name: windows-crash-python-${{ matrix.python-version }}-${{ matrix.dep-level }}
        path: |
          pytest-debugger.log
          pytest-crash.dmp
        if-no-files-found: ignore
        retention-days: 7

    - name: Upload coverage to Coveralls
      uses: coverallsapp/github-action@v2
      continue-on-error: true
      with:
        github-token: ${{ secrets.github_token }}
        flag-name: run-${{ join(matrix.*, '-') }}
        path-to-lcov: coverage.lcov
        parallel: true

  finish:
    needs: test
    runs-on: ubuntu-latest
    steps:
    - name: Upload to Coveralls finished
      uses: coverallsapp/github-action@v2
      with:
        github-token: ${{ secrets.github_token }}
        parallel-finished: true
