# This workflow checks the base package installation across supported Python versions using uv's pip-compatible interface.
# It validates package metadata, dependency resolution and importability rather than the pip executable itself.

name: pip-install

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    name: ${{ matrix.os }}, python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}

    strategy:
      matrix:
        os: ["ubuntu-latest", "macos-latest"]
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true

      - name: Install project with uv
        run: uv pip install --system "."

      # Check import works
      - name: Check import works with base environment
        run: python -c "import geoutils"
