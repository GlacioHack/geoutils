name: benchmarks

on:
  pull_request:
    paths:
      - "benchmarks/**"
      - "geoutils/_dispatch.py"
      - "geoutils/_misc.py"
      - "geoutils/filters.py"
      - "geoutils/profiler.py"
      - "geoutils/interface/gridding.py"
      - "geoutils/interface/interpolation.py"
      - "geoutils/interface/rasterization.py"
      - "geoutils/interface/vectorization.py"
      - "geoutils/multiproc/**"
      - "geoutils/pointcloud/**"
      - "geoutils/raster/base.py"
      - "geoutils/raster/xr_accessor.py"
      - "geoutils/stats/**"
      - "geoutils/vector/**"
      - "asv.conf.json"
      - "conftest.py"
      - "dev-environment.yml"
      - "pyproject.toml"
      - "setup.cfg"
      - ".github/workflows/benchmarks.yml"
  workflow_dispatch:
    inputs:
      suite:
        description: "Benchmark suite to run"
        required: true
        default: "asv"
        type: choice
        options:
          - asv
          - large-data
          - all
      publish_pages:
        description: "Deploy the generated ASV site to GitHub Pages"
        required: false
        default: false
        type: boolean
      large_data_shape:
        description: "Square shape for large data tests"
        required: false
        default: "12288"
      large_data_memory_limit:
        description: "Per-worker memory ceiling for large data tests"
        required: false
        default: "512MB"
      large_data_chunks:
        description: "Square chunk size for large data tests"
        required: false
        default: "1024"
  schedule:
    - cron: "0 3 * * 0"

concurrency:
  group: benchmarks-${{ github.event_name == 'pull_request' && github.event.pull_request.number || github.ref }}
  cancel-in-progress: false

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      asv: ${{ steps.paths.outputs.asv }}
      large_data: ${{ steps.paths.outputs.large_data }}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Select benchmark suites changed by the pull request
        id: paths
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          asv=false
          large_data=false
          git diff --name-only --diff-filter=ACMR "$BASE_SHA" "$HEAD_SHA" > changed-benchmark-files.txt
          while IFS= read -r path; do
            case "$path" in
              benchmarks/workflows/*|geoutils/_dispatch.py|geoutils/_misc.py|geoutils/filters.py|geoutils/profiler.py|geoutils/interface/gridding.py|geoutils/interface/interpolation.py|geoutils/interface/rasterization.py|geoutils/interface/vectorization.py|geoutils/multiproc/*|geoutils/pointcloud/*|geoutils/raster/base.py|geoutils/raster/xr_accessor.py|geoutils/stats/*|geoutils/vector/*|dev-environment.yml|setup.cfg|.github/workflows/benchmarks.yml)
                asv=true
                large_data=true
                ;;
              benchmarks/asv_suite/*|asv.conf.json)
                asv=true
                ;;
              benchmarks/test_large_data.py|conftest.py|pyproject.toml)
                large_data=true
                ;;
            esac
          done < changed-benchmark-files.txt
          echo "asv=$asv" >> "$GITHUB_OUTPUT"
          echo "large_data=$large_data" >> "$GITHUB_OUTPUT"

  large-data-test:
    needs: changes
    if: >-
      ${{
        (github.event_name == 'pull_request' && needs.changes.outputs.large_data == 'true') ||
        (github.event_name == 'workflow_dispatch' && (inputs.suite == 'large-data' || inputs.suite == 'all'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 180
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-update-conda: true
          use-mamba: true
          channel-priority: strict
          activate-environment: geoutils-dev

      - name: Install large data environment
        run: |
          mamba install pyyaml python=3.12
          python .github/scripts/generate_yml_env_fixed_py.py --pyv 3.12 --add "gdal<3.13.3" "environment.yml"
          mamba env update -n geoutils-dev -f environment-ci-py3.12.yml
          pip install -e .[test,benchmark]

      - name: Run large data tests
        env:
          GEOUTILS_LARGE_DATA_SHAPE: ${{ inputs.large_data_shape || '12288' }}
          GEOUTILS_LARGE_DATA_CHUNKS: ${{ inputs.large_data_chunks || '1024' }}
          GEOUTILS_LARGE_DATA_MEMORY_LIMIT: ${{ inputs.large_data_memory_limit || '512MB' }}
        run: pytest --large-data -m large_data -ra

  asv:
    needs: changes
    if: >-
      ${{
        (github.event_name == 'pull_request' && needs.changes.outputs.asv == 'true') ||
        github.event_name == 'schedule' ||
        (github.event_name == 'workflow_dispatch' && (inputs.suite == 'asv' || inputs.suite == 'all'))
      }}
    runs-on: ubuntu-latest
    timeout-minutes: 240
    defaults:
      run:
        shell: bash -l {0}
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: conda-incubator/setup-miniconda@v4
        with:
          miniforge-version: latest
          auto-update-conda: true
          use-mamba: true
          channel-priority: strict
          activate-environment: geoutils-dev

      - name: Install benchmark environment
        run: |
          mamba install pyyaml python=3.12
          python .github/scripts/generate_yml_env_fixed_py.py --pyv 3.12 --add "gdal<3.13.3" "environment.yml"
          mamba env update -n geoutils-dev -f environment-ci-py3.12.yml
          pip install -e .[benchmark]

      - name: Check ASV benchmarks
        run: asv check -E existing

      - name: Configure comparable CI machine metadata
        run: |
          cpu_model="$(awk -F ': ' '/model name/{print $2; exit}' /proc/cpuinfo)"
          cpu_key="$(printf '%s' "$cpu_model" | sha256sum | cut -c1-8)"
          echo "ASV_MACHINE_NAME=github-actions-${RUNNER_ARCH,,}-$cpu_key" >> "$GITHUB_ENV"
          asv machine --yes --machine "github-actions-${RUNNER_ARCH,,}-$cpu_key"

      - name: Run ASV smoke benchmark pass
        if: ${{ github.event_name == 'pull_request' }}
        run: asv run --quick --show-stderr -E existing --machine "$ASV_MACHINE_NAME"

      - name: Restore saved ASV history
        if: ${{ github.event_name != 'pull_request' }}
        run: |
          mkdir -p benchmarks/results/asv/results
          if git fetch origin refs/heads/asv-results:refs/remotes/origin/asv-results; then
            git archive refs/remotes/origin/asv-results | tar -x -C benchmarks/results/asv/results
          fi

      - name: Run repeatable ASV benchmarks
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BENCHMARK_COMMIT: ${{ github.sha }}
        run: |
          asv run --show-stderr --record-samples -E existing \
            --machine "$ASV_MACHINE_NAME" --set-commit-hash "$BENCHMARK_COMMIT"

      - name: Publish ASV website and implementation comparisons
        if: ${{ github.event_name != 'pull_request' }}
        env:
          BENCHMARK_COMMIT: ${{ github.sha }}
        run: |
          asv publish
          python -m benchmarks.asv_suite.render_results \
            --machine "$ASV_MACHINE_NAME" \
            --commit "$BENCHMARK_COMMIT"

      - name: Upload ASV measurements
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: asv-results
          path: benchmarks/results/asv/results
          retention-days: 90

      - name: Upload ASV website preview
        if: ${{ github.event_name != 'pull_request' }}
        uses: actions/upload-artifact@v4
        with:
          name: asv-site-preview
          path: benchmarks/results/asv/html
          retention-days: 14

      - name: Configure GitHub Pages
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pages }}
        uses: actions/configure-pages@v5

      - name: Upload GitHub Pages artifact
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_pages }}
        uses: actions/upload-pages-artifact@v4
        with:
          path: benchmarks/results/asv/html

  save-asv-results:
    needs: asv
    if: ${{ needs.asv.result == 'success' && github.event_name != 'pull_request' }}
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v5
        with:
          name: asv-results
          path: ${{ runner.temp }}/asv-results

      - name: Store ASV history on its data branch
        env:
          HISTORY_DIRECTORY: ${{ runner.temp }}/asv-history
          RESULTS_DIRECTORY: ${{ runner.temp }}/asv-results
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          if git fetch origin refs/heads/asv-results:refs/remotes/origin/asv-results; then
            git worktree add --detach "$HISTORY_DIRECTORY" refs/remotes/origin/asv-results
          else
            git worktree add --detach "$HISTORY_DIRECTORY"
            git -C "$HISTORY_DIRECTORY" switch --orphan asv-results
            git -C "$HISTORY_DIRECTORY" rm -r --ignore-unmatch .
          fi
          git -C "$HISTORY_DIRECTORY" rm -r --ignore-unmatch .
          cp -a "$RESULTS_DIRECTORY"/. "$HISTORY_DIRECTORY"/
          git -C "$HISTORY_DIRECTORY" add -A
          if git -C "$HISTORY_DIRECTORY" diff --cached --quiet; then
            exit 0
          fi
          git -C "$HISTORY_DIRECTORY" commit -m "BENCH: Store ASV results for ${{ github.sha }}"
          git -C "$HISTORY_DIRECTORY" push origin HEAD:asv-results

  deploy-asv:
    needs: [asv, save-asv-results]
    if: >-
      ${{
        needs.asv.result == 'success' && needs.save-asv-results.result == 'success' &&
        github.event_name == 'workflow_dispatch' && inputs.publish_pages
      }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy ASV website to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
