# This workflow tests the documentation build on every PR commit

name: documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]
  schedule:
    - cron: '17 6 * * 1'
  workflow_dispatch:

jobs:
  # Update .readthedocs.yaml when changing OS, Python or dependencies
  doc:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install project with documentation dependencies
        run: uv pip install --system --torch-backend=cpu -e ".[doc,opt]"
      - name: Sphinx build
        run: |
          cd doc
          sphinx-build -T -b html source/ build/

  linkcheck:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.3.2
        with:
          enable-cache: true
      - name: Install project with documentation dependencies
        run: uv pip install --system --torch-backend=cpu -e ".[doc,opt]"
      - name: Check external links
        run: |
          cd doc
          sphinx-build -T -D nb_execution_mode=off -b linkcheck source/ build/linkcheck/
