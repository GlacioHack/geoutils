# This workflow tests the documentation build on every PR commit

name: documentation

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  doc:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v10.1.0
        with:
          enable-cache: true
      - name: Install project with documentation dependencies
        run: uv pip install --system -e ".[doc,opt]"
      - name: Sphinx build
        run: |
          cd doc
          sphinx-build -T -b html source/ build/
