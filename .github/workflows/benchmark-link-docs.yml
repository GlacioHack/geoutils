name: benchmark-link-docs

# This manual workflow does not run benchmarks. It renders the newest saved ASV comparisons, stores a downloadable
# preview and opens a pull request linking the reviewed graphics into the user documentation
on:
  workflow_dispatch:

jobs:
  update-reference-graphics:
    runs-on: ubuntu-latest
    permissions:
      # The workflow creates a branch and pull request instead of changing main directly
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Install the benchmark renderer
        run: python -m pip install -e .[benchmark]

      - name: Restore the saved ASV measurements
        run: |
          # The ASV workflow keeps raw history on this data-only branch
          mkdir -p benchmarks/results/asv/results
          git fetch origin refs/heads/asv-results:refs/remotes/origin/asv-results
          git archive refs/remotes/origin/asv-results | tar -x -C benchmarks/results/asv/results

      - name: Render the newest complete documentation snapshot
        run: |
          # Documentation mode selects stable comparison plots rather than rebuilding the complete ASV website
          python -m benchmarks.asv_suite.render_results \
            --doc-only \
            --doc-dir doc/source/imgs/benchmarking

      - name: Upload the documentation snapshot
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-link-docs-${{ github.run_id }}
          path: doc/source/imgs/benchmarking
          retention-days: 90

      - name: Commit changed reference graphics
        id: commit
        env:
          DOCUMENTATION_BRANCH: benchmark-link-docs/${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          # Stop without opening an empty pull request when the latest measurements render identically
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add doc/source/imgs/benchmarking
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git switch -c "$DOCUMENTATION_BRANCH"
          git commit -m "DOC: Update benchmark reference results"
          git push --set-upstream origin "$DOCUMENTATION_BRANCH"
          echo "changed=true" >> "$GITHUB_OUTPUT"
          echo "branch=$DOCUMENTATION_BRANCH" >> "$GITHUB_OUTPUT"

      - name: Open the documentation update pull request
        if: steps.commit.outputs.changed == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          DOCUMENTATION_BRANCH: ${{ steps.commit.outputs.branch }}
        run: |
          gh pr create \
            --base main \
            --head "$DOCUMENTATION_BRANCH" \
            --title "DOC: Update benchmark reference results" \
            --body "Generated from the newest complete ASV comparison result saved by CI."
